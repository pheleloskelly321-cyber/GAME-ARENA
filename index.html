<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Arena - Tic Tac Toe 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a15;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; /* Pou anpeche telefòn lan zoom lè w ap jwe */
        }
        canvas { display: block; }
        
        /* Bwat pou enfòmasyon yo (HUD) */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        #status {
            background: rgba(0, 0, 0, 0.7);
            color: #00fff0;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #00fff0;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(0, 255, 240, 0.3);
        }
        #reset-btn {
            pointer-events: auto;
            background: #00fff0;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 240, 0.4);
        }
        #reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div id="status">Tou: X</div>
        <button id="reset-btn">Rekòmanse</button>
    </div>

    <!-- Chaje Three.js soti sou entènèt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. PREPARE SÈN 3D LA
        const scene = new THREE.Scene();
        
        // Kamera a
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 7, 7);
        camera.lookAt(0, 0, 0);

        // Rendu a (sa ki desinen bagay yo sou ekran an)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. LIMYÈ
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Limyè neon pou bay atmosfè gaming lan
        const pointLight1 = new THREE.PointLight(0x00fff0, 1, 20);
        pointLight1.position.set(-5, 5, -5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffd700, 1, 20);
        pointLight2.position.set(5, 5, 5);
        scene.add(pointLight2);

        // 3. KREYE TABLO A (BOARD LA)
        const board = [];
        const boardGroup = new THREE.Group();
        scene.add(boardGroup);

        const squareSize = 2;
        const gap = 0.1;

        for (let i = 0; i < 9; i++) {
            const x = (i % 3 - 1) * (squareSize + gap);
            const z = (Math.floor(i / 3) - 1) * (squareSize + gap);

            // Materyèl kare a
            const geometry = new THREE.BoxGeometry(squareSize, 0.2, squareSize);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x16162a,
                roughness: 0.2,
                metalness: 0.8
            });
            const square = new THREE.Mesh(geometry, material);
            square.position.set(x, 0, z);
            square.receiveShadow = true;
            square.userData = { index: i, value: null, x: x, z: z };
            
            boardGroup.add(square);
            board.push(square);
        }

        // 4. JWE A (TIC TAC TOE LOGIC)
        let currentPlayer = 'X';
        let gameOver = false;
        const winLines = [
            [0,1,2], [3,4,5], [6,7,8], // Ranje
            [0,3,6], [1,4,7], [2,5,8], // Kolòn
            [0,4,8], [2,4,6]           // Dyagonal
        ];

        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('reset-btn');

        function createX(x, z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x00fff0, emissive: 0x00fff0, emissiveIntensity: 0.5 });
            
            const geo1 = new THREE.BoxGeometry(0.3, 0.3, 1.4);
            const piece1 = new THREE.Mesh(geo1, mat);
            piece1.rotation.y = Math.PI / 4;
            piece1.castShadow = true;
            
            const piece2 = new THREE.Mesh(geo1, mat);
            piece2.rotation.y = -Math.PI / 4;
            piece2.castShadow = true;

            group.add(piece1);
            group.add(piece2);
            group.position.set(x, 0.3, z);
            return group;
        }

        function createO(x, z) {
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.5 });
            const geo = new THREE.TorusGeometry(0.5, 0.15, 16, 32);
            const piece = new THREE.Mesh(geo, mat);
            piece.rotation.x = Math.PI / 2;
            piece.position.set(x, 0.3, z);
            piece.castShadow = true;
            return piece;
        }

        function checkWinner() {
            for (let line of winLines) {
                const [a, b, c] = line;
                if (board[a].userData.value && 
                    board[a].userData.value === board[b].userData.value && 
                    board[a].userData.value === board[c].userData.value) {
                    return board[a].userData.value;
                }
            }
            if (board.every(sq => sq.userData.value !== null)) return 'Draw';
            return null;
        }

        // 5. DETEKTE KLIK SOU EKRAN (TOUCH)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerDown(event) {
            if (gameOver) return;

            // Konvèti pozisyon dwèt la an kowòdone 3D
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(board);

            if (intersects.length > 0) {
                const clickedSquare = intersects[0].object;
                
                // Si kare a vid
                if (!clickedSquare.userData.value) {
                    clickedSquare.userData.value = currentPlayer;
                    
                    let newPiece;
                    if (currentPlayer === 'X') {
                        newPiece = createX(clickedSquare.userData.x, clickedSquare.userData.z);
                    } else {
                        newPiece = createO(clickedSquare.userData.x, clickedSquare.userData.z);
                    }
                    scene.add(newPiece);

                    const winner = checkWinner();
                    if (winner) {
                        gameOver = true;
                        if (winner === 'Draw') {
                            statusText.innerText = "Match Nul!";
                            statusText.style.color = "#fff";
                        } else {
                            statusText.innerText = `Gayan: ${winner}!`;
                            statusText.style.color = winner === 'X' ? "#00fff0" : "#ffd700";
                        }
                    } else {
                        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                        statusText.innerText = `Tou: ${currentPlayer}`;
                        statusText.style.color = currentPlayer === 'X' ? "#00fff0" : "#ffd700";
                    }
                }
            }
        }

        window.addEventListener('pointerdown', onPointerDown);

        // 6. REKÒMANSE
        resetBtn.addEventListener('click', () => {
            // Retire tout pyès yo
            const piecesToRemove = scene.children.filter(child => child.type === 'Group' || child.type === 'Mesh');
            piecesToRemove.forEach(child => {
                if (child !== boardGroup && child.type !== 'DirectionalLight') {
                     // Nou pa vle retire limyè yo ak board la
                     if(child.geometry && child.geometry.type === 'TorusGeometry') scene.remove(child);
                     if(child.type === 'Group' && child.children.length === 2) scene.remove(child);
                }
            });
            
            // Reset board state
            board.forEach(sq => sq.userData.value = null);
            currentPlayer = 'X';
            gameOver = false;
            statusText.innerText = "Tou: X";
            statusText.style.color = "#00fff0";
        });

        // 7. AJISTE EKRAN SI W VIRE TELEFÒN LAN
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. BOUK ANIMASYON (Sa k fè l deplase)
        function animate() {
            requestAnimationFrame(animate);
            
            // Fè board la vire tou dousman (ou ka kòmante li si w pa vle)
            // boardGroup.rotation.y += 0.002; 

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
